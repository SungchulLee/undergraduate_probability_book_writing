            - 덧셈 법칙: ch01/basic/addition_rule.md
            - 포함배제 원리: ch01/basic/inclusion_exclusion.md
        - 1.2 순열:
            - 서로 다른 대상의 순열: ch01/permutations/distinct.md
            - 중복이 있는 순열: ch01/permutations/repetition.md
            - 원순열: ch01/permutations/circular.md
        - 1.3 조합:
            - 조합과 이항계수: ch01/combinations/binomial_coefficients.md
            - 중복조합(막대와 별): ch01/combinations/stars_and_bars.md
